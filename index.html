font-size:36px;

<script>

let text="";

function addChar(char){
    text += char;
    document.getElementById("display").textContent = text;
}

function deleteOne(){
    text = text.slice(0,-1);
    document.getElementById("display").textContent = text;
}

function clearText(){
    text = "";
    document.getElementById("display").textContent = "";
}


function replaceLastChar(map){
    if(text.length === 0) return;

    const last = text.slice(-1);
    if(map[last]){
        text = text.slice(0,-1) + map[last];
        document.getElementById("display").textContent = text;
    }
}

function toSmallTsu(){
    const map = {
	"つ":"っ","や":"ゃ","ゆ":"ゅ","よ":"ょ",
	"あ":"ぁ","い":"ぃ","う":"ぅ","え":"ぇ","お":"ぉ",
    };
    replaceLastChar(map);
}

function toDakuon(){
    const map = {
        "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご",
        "さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ",
        "た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど",
        "は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"
    };
    replaceLastChar(map);
}

function toHandakuon(){
    const map = {
        "は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ"
    };
    replaceLastChar(map);
}

function speakText(){

    if(text==="") return;

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ja-JP";
    utterance.rate = 0.6;

    speechSynthesis.speak(utterance);
}

</script>
